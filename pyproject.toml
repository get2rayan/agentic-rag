[project]
name = "agentic-rag"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.7",
    "ipykernel>=7.2.0",
    "nbformat>=5.10.4",
    "openai>=2.31.0",
    "openai-agents>=0.13.6",
    "plotly>=6.7.0",
    "python-dotenv>=1.2.2",
    "rank-bm25>=0.2.2",
    "requests>=2.33.1",
    "scikit-learn>=1.8.0",
    "sentence-transformers>=5.6.1",
]

[dependency-groups]
dev = [
    "datasets>=5.0.1",
    "faiss-cpu>=1.15.0",
    "jupyterlab>=4.6.3",
    "langchain<1.0",
    "langchain-community<0.4",
    "langchain-core<1.0",
    "langchain-openai<1.0",
    "ragas>=0.4.0",
]
